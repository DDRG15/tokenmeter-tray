[pytest]
# Last-resort limit per test so nothing can hang the suite. Native tests also
# kill their own processes after 120 s (tests/test_native_window.py) to fail
# with a clear message first. `-p pytest_timeout` loads the plugin even when
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 (as in CI).
addopts = -p pytest_timeout
timeout = 300
timeout_method = thread
